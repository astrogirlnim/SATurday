proof_sketch: >
  Sunflower lemma certificate for parity-6 size budget 12.
  Key object: prime implicant set system M of parity-6 over universe U={1,...,6}.
  M consists of all C(6,1)+C(6,3)+C(6,5) = 32 odd-cardinality subsets of U.
  A size-12 monotone circuit computing parity-6 via OR of AND gates requires
  a family F of at most 12 sets (AND gate supports) such that every S in M
  contains some T_i in F (covering condition) and no T_i is contained in any
  even-weight set (correctness condition).
  The correctness condition forces each T_i to have odd weight (else T_i subset
  of some even-weight input would give a false positive).
  The covering condition requires F to cover all 32 odd-weight minterms.
  Sunflower argument: the 20 size-3 minterms form a family where any 7 sets
  contain a 2-sunflower (by Erdos-Ko with p=2, w=3: threshold = 3! = 6).
  A 2-sunflower {A, B} with core C means A = C union P1, B = C union P2 with
  P1 and P2 disjoint. Any T_i covering both A and B must satisfy T_i subset A
  and T_i subset B, so T_i subset A intersect B = C. But then T_i subset C
  and |C| = |A| - 1 = 2 (even), contradicting the odd-weight requirement for T_i.
  Hence no single gate can cover two sunflower petals simultaneously.
  This forces at least one gate per petal, giving a lower bound of at least
  floor(20 / max_coverage_per_gate) gates needed, which for max fan-in 3
  is ceil(20 / 4) = 5 gates just for size-3 minterms.
  Combined with the 6 size-1 minterms each requiring their own singleton gate
  (since a size-1 minterm {i} can only be covered by the gate {i} itself, and
  each such gate causes false positives on all even-weight sets containing i
  unless the OR structure is carefully designed), the total gate count needed
  exceeds 12 for the full parity function.
  The CNF encoding captures this as a SAT query: can 12 monotone AND gates
  simultaneously satisfy the covering and non-covering constraints for all
  64 input assignments?
natural_proof_risk: low
key_object: prime_implicant_set_system
technique_used: sunflower_lemma
largeness_used: false
constructivity_score: 0.3
geometer_note: >
  The natural proof risk is low because this argument is specific to parity
  (it exploits the exact structure of odd-weight sets) and does not apply to
  a large class of functions. The sunflower structure of odd-weight sets is
  a property unique to parity, not a generic largeness argument.
  The argument relies on the parity-specific constraint that all AND gate
  supports must have odd weight, which restricts the family F to a highly
  structured subset of the power set.
