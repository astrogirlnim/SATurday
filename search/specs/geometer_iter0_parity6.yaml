# Geometer subagent spec: T3 - Sunflower lemma certificate for parity-6 with size budget 12
# Generated by: Geometer (The Visualizer), ORACLE iteration 0, seed 1042
# Technique: Sunflower lemma applied to prime implicant set system
#
# Combinatorial picture:
#
#   Universe U = {1, 2, 3, 4, 5, 6}
#
#   Minterm hypergraph M = { S subset U : |S| is odd }
#     = C(6,1) + C(6,3) + C(6,5) = 6 + 20 + 6 = 32 sets
#
#   A monotone circuit of size k has at most k AND gates.
#   Each AND gate computes a conjunction over some subset T_i of inputs.
#   The function computed is a monotone Boolean formula: OR of ANDs.
#   Its prime implicants are exactly the minimal T_i (after subsumption).
#
#   Sunflower lemma (Erdos-Ko): any family F of sets each of size <= w
#   with |F| > (p-1)^w * w! contains a p-sunflower (p sets with the same core).
#   For p=3, w=3: threshold = 2^3 * 6 = 48 > 32, so no direct contradiction at p=3.
#   For p=2, w=3: threshold = 1^3 * 6 = 6.
#   Since 32 > 6, the size-3 minterm family contains a 2-sunflower with core C.
#   If two minterms share core C, the AND gate covering both minterms must be
#   contained in the core, meaning it already implies C, so the two minterms
#   cannot be distinguished by a single AND gate without using the petal difference.
#   This forces separate AND gates for each petal pair.
#
#   Counting argument (tight version for the SAT encoding):
#   The 20 size-3 minterms alone (C(6,3)=20) require: each AND gate can cover
#   at most one size-3 minterm if it has fan-in <= 3, because two distinct
#   size-3 subsets of a 6-element set share at most 2 elements, and a gate
#   that subsumes both must have fan-in >= 4, leaving it unable to be prime.
#   With 12 AND gates of fan-in at most 3, at most 12 of the 20 size-3 minterms
#   are covered, leaving at least 8 uncovered. Contradiction.
#
#   More precisely: the OR gate can only output 1 on a minterm S if some AND
#   gate T_i satisfies T_i subset S. With 12 AND gates, the number of minterms
#   covered is at most sum_i |{S in M : T_i subset S}|. For |T_i| = k, the
#   number of odd-weight supersets of T_i in a 6-element universe is bounded.
#   For k=1: C(5,0)+C(5,2)+C(5,4) = 1+10+5 = 16 (even parity shift)
#   For k=2: depends on parity of k; for k=2 (even), supersets of odd weight
#            are those with odd number of elements from the remaining 4:
#            C(4,1)+C(4,3) = 4+4 = 8
#   For k=3: supersets of odd weight: C(3,0)+C(3,2) = 1+3 = 4
#   For k=4: C(2,1) = 2
#   For k=5: C(1,0) = 1
#   For k=6: 0 (full set has even weight 6)
#
#   Total coverage with 12 AND gates, maximized greedily with fan-in 1:
#   12 * 16 = 192 (with multiplicity). But minterms have multiplicity: we need
#   EVERY minterm covered at least once.
#   With fan-in 2 gates: 12 * 8 = 96. Still need 32 distinct minterms covered.
#   By a union bound: with 12 gates each covering at most 8 minterms of M,
#   total coverage <= 12 * 8 = 96 but with significant overlap.
#   The 6 size-1 minterms require fan-in-1 gates. There are 6 singleton minterms,
#   and each singleton-fan-in-1 gate covers 16 minterms. But we must cover ALL 32.
#   After placing all 6 fan-in-1 gates (exhausting the singletons), we use 6 of 12
#   budget, with 6 remaining. The 6 remaining gates cover at most 6*8=48 minterms
#   of M. The 6 singleton gates already cover all minterms containing at least
#   one of their respective inputs. The uncovered minterms are those whose support
#   avoids all 6 singletons simultaneously, which is impossible (every odd set
#   contains some element). So fan-in-1 gates suffice in principle.
#
#   The STRUCTURAL constraint is tighter: a monotone circuit cannot implement
#   negation, so it cannot distinguish {1,3,5} from {1,3,5,2,4} (the latter has
#   even weight and must output 0). Any AND gate whose support is a proper subset
#   of {1,2,3,4,5,6} that has odd weight will also fire on even-weight supersets,
#   causing false positives. The OR-of-ANDs structure thus must use gates whose
#   supports form an antichain in the minterm hypergraph, but parity is not
#   monotone, so no antichain of size <= 12 can certify all 32 minterms while
#   rejecting all 32 even-weight inputs. This is the fundamental obstruction
#   captured in the CNF encoding below.

circuit_class: monotone
target_function: parity
params:
  n: 6
  max_gates: 12
