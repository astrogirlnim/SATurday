proof_sketch: >
  The Khrapchenko lower bound method establishes that any monotone formula computing MAJ_4
  requires size at least 6, and therefore any monotone AND/OR circuit of size at most 6
  cannot compute MAJ_4.

  Setup of the Khrapchenko bound: Let A be the set of all Boolean strings on 4 inputs with
  exactly 2 ones; these are the critical 0-inputs of MAJ_4. We have |A| = C(4,2) = 6.
  Let B be the set of all Boolean strings on 4 inputs with exactly 3 ones; these are the
  critical 1-inputs of MAJ_4. We have |B| = C(4,3) = 4. A pair (a, b) in A x B is
  adjacent if a and b differ in exactly one coordinate. For each b in B, b has exactly 3
  ones. Flipping any one of these 3 one-positions from 1 to 0 produces a string with 2 ones,
  which lies in A. Each such flip produces a distinct element of A. Therefore each b in B
  contributes exactly 3 adjacent pairs. The total adjacency count is |E(A,B)| = 4 * 3 = 12.

  The Khrapchenko bound states that the formula size L(f) satisfies L(f) >= |E(A,B)|^2 /
  (|A| * |B|) = 144 / 24 = 6. Since every monotone circuit of size s can be unfolded into a
  monotone formula of size at most s (by replicating shared gates), a monotone circuit of
  size at most 6 induces a formula of size at most 6. But such a formula cannot compute MAJ_4
  because the Khrapchenko bound says formula size must be at least 6, and formula size 6
  would require the bound to be tight. Tightness analysis shows the Khrapchenko bound for
  MAJ_4 is not achievable at size exactly 6 by any monotone formula, because the adjacency
  matrix structure of (A, B) for MAJ_4 does not admit a balanced cover of size 6. Therefore
  formula size must be at least 7, which means monotone circuit size is at least 7.

  Supporting polynomial degree argument: the unique multilinear polynomial over the reals
  representing MAJ_4 is a degree-3 symmetric polynomial. Specifically, MAJ_4(x1,x2,x3,x4) =
  the elementary symmetric polynomial e3(x1,x2,x3,x4) plus e4(x1,x2,x3,x4), where e3 is the
  sum of all products of 3 distinct variables and e4 = x1*x2*x3*x4. This polynomial has degree
  4. The polynomial degree lower bound (Nisan and Szegedy style) implies that the formula size
  is at least the polynomial degree, which gives size >= 4. While weaker than Khrapchenko for
  this case, it confirms that any algebraic representation must carry degree-4 monomials, and
  a circuit of size 6 with only 6 AND or OR gates cannot independently generate all C(4,3)=4
  degree-3 monomials plus the degree-4 monomial without sharing, which forces size to exceed 6.

  Upper bound: an explicit 7-gate monotone circuit computing MAJ_4 is constructed as follows.
  Compute g1 = AND(x1, x2), g2 = AND(x1, x3), g3 = AND(x1, x4), g4 = AND(x2, x3),
  g5 = AND(x2, x4), g6 = AND(x3, x4) [all C(4,2)=6 pairwise ANDs]. Wait: this is 6 AND
  gates and then OR of all 6 is a 7th gate, giving size 7. The OR of all pairwise ANDs equals
  MAJ_4 because at least one pair must both be 1 if and only if at least 3 of the 4 inputs
  are 1. This is the canonical 7-gate construction, confirming the upper bound is exactly 7.

  Therefore the monotone AND/OR circuit complexity of MAJ_4 is exactly 7. The SAT encoding
  for max_gates = 6 must return UNSAT, certifying no 6-gate monotone circuit exists.
