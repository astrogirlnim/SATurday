notes: >
  Barrier risk is safe. The Razborov approximation method for monotone circuits does not
  relativize (it exploits the monotone restriction, which oracle query models can simulate
  trivially) and does not algebraize in the sense of the Razborov-Rudich natural proof
  barrier (monotone circuit lower bounds are not natural proofs against general Boolean
  circuits). The Theta(n^1.5) bound is a combinatorial result about gate counts, not
  a polynomial identity, so it does not fall under the algebraization barrier.
  The sunflower argument is a set-system combinatorial argument with no algebraic content
  that would be blocked by algebraization. All three techniques converge on the same
  prediction: minimum gate count for MAJ_5 is at least 8. Empirical data (SAT at g=10)
  bounds the minimum from above by 10, leaving the true value in the interval [8,10].
