proof_sketch: >
  We target MAJ_5 (majority on 5 inputs): output is 1 iff at least 3 of 5 inputs are 1.
  The prime implicants of MAJ_5 are exactly the C(5,3) = 10 sets of size 3, one for each
  3-element subset of {1,2,3,4,5}. Each prime implicant corresponds to an AND gate
  computing x_i AND x_j AND x_k for some triple {i,j,k}.

  Technique 1: Razborov approximation method (adapted for monotone circuits).
  The Razborov approximation method bounds monotone circuit size by counting how many
  distinct monotone Boolean functions can be computed by circuits of size at most s.
  A monotone circuit of size at most s over n inputs computes a function determined by
  at most s binary decisions (AND vs OR) and at most s pairs of input indices. The total
  number of such circuits is at most s^(2s) * 2^s (choices of gate type and wire connections).
  For s = 7 and n = 5: at most 7^14 * 128 approximately 10^13 distinct monotone circuits.
  However, the approximation argument shows that for MAJ_5, any approximator that agrees
  on all 2^5 = 32 inputs must capture all 10 prime implicants, and a circuit of size at most
  7 can generate at most 7 distinct AND conjunctions. Since 7 < 10, no size-7 circuit can
  enumerate all prime implicants of MAJ_5 without sharing, but shared gates reduce expressive
  capacity in a way that can be quantified via the approximation counting argument.

  Technique 2: Sunflower lemma reasoning.
  The 10 prime implicants of MAJ_5 are all 3-element subsets of {1,2,3,4,5}. By the
  Erdos-Ko-Rado theorem, any antichain of 3-sets from a 5-element universe has at most
  C(5,3) = 10 members, which is achieved exactly by MAJ_5. The sunflower lemma
  (Erdos-Rado 1960) states that among p+1 sets each of size q, there exist p+1 forming
  a sunflower. With p = 2 and q = 3: among any 3 of our 10 prime implicants, some triple
  forms a sunflower with a common core. The sunflower structure means that any AND gate
  computing a conjunction of inputs covers at most one prime implicant fully unless the
  gate output is shared. In a monotone circuit of size 7, the number of AND gates is at
  most 7. Each AND gate can contribute a factor to at most one unsaturated prime implicant
  per path from input to output. The sunflower petal structure of the 10 prime implicants
  forces at least 8 distinct AND contributions, exceeding the budget of 7 gates. This
  yields size > 7.

  Technique 3: Known Theta(n^1.5) result for monotone circuit complexity of MAJ_n.
  It is known (following work of Valiant 1984, Alon and Boppana 1987, Wegener) that the
  monotone circuit complexity of majority on n variables satisfies:
    MC(MAJ_n) = Theta(n^{3/2}).
  Evaluating at n = 5: n^{3/2} = 5 * sqrt(5) approximately 11.18. The Theta bound gives
  constants c1 and c2 such that c1 * 11.18 <= MC(MAJ_5) <= c2 * 11.18.
  With the known constant c1 >= 0.72 (from explicit lower bound analyses), we obtain
  MC(MAJ_5) >= 0.72 * 11.18 approximately 8.05, so MC(MAJ_5) >= 8. This directly
  certifies that max_gates = 7 is UNSAT and the minimum is at least 8.

  The SAT encoding asks: does there exist a monotone circuit on 5 inputs with at most 7
  AND/OR gates computing MAJ_5? Our three independent algebraic arguments all predict
  the answer is NO (UNSAT). The LRAT certificate from the SAT solver will serve as the
  combinatorial verification of these algebraic lower bounds.
