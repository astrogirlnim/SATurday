# Bet A V3 Sample: Quick validation of multi-function/multi-circuit generation
# Goal: Verify infrastructure works end-to-end with small sample
# Expected: 12 instances (3 types × 2 functions × 2 sizes × 1 seed = 12)

# Inherit from defaults
offline:
  enabled: true
  check_api_keys: true

artifacts:
  store_dir: "proofs"
  auto_register: true
  verify_on_load: false

solver:
  binary: "infra/build/kissat"
  default_seed: 42
  timeout_seconds: 60
  enable_lrat: true
  cpu_only: true

circuits:
  max_gates: 1000
  max_depth: 100
  max_inputs: 100
  validate_topology: true

# V3 Sample: Reduced scope for quick validation
bets:
  bet_a:
    enabled: true
    circuit_types:
      - "monotone"
      - "ac0"
      - "formula"
    target_functions:
      - "parity"
      - "majority"
    size_range:
      min: 6
      max: 7
      step: 1
    seed_range:
      start: 12000
      count: 1

# Agent overrides
agents:
  planner:
    enabled: true
    task_batch_size: 100
  conjecturer:
    enabled: true
    mode: "template"
    template_depth: 3
    max_conjectures: 100
  miner:
    enabled: true
    small_n_only: false
    max_variables: 100
    max_clauses: 10000
  formalizer:
    enabled: true
    allow_sorry: true
    tactic_timeout: 30
  critic:
    enabled: true
    check_relativization: true
    check_natural_proofs: true
    check_algebraization: false

logging:
  level: "INFO"
  format: "jsonl"
  log_dir: "search/logs"
  console_output: true
  verbose: false

execution:
  parallel: false
  max_workers: 1
  checkpoint_interval: 10
  continue_on_error: true

reproducibility:
  pin_dependencies: true
  check_determinism: true
  record_hashes: true
  fixed_seeds: true

cost:
  enabled: true
  max_monthly_spend: 0
  block_api_calls: true
  allowed_domains: []

verification:
  enable_lrat_check: true
  lrat_checker: "lrat-check"
  enable_lean_build: true
  lean_timeout: 300
