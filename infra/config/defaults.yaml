# Default configuration for SATurday
# This file defines sensible defaults for all components

# Offline policy enforcement
offline:
  enabled: true
  # Block network access during execution
  check_api_keys: true
  # Fail if API keys detected in environment

# Artifact store configuration
artifacts:
  store_dir: "proofs"
  # Directory for content-addressed artifact storage
  auto_register: true
  # Automatically register artifacts in store
  verify_on_load: false
  # Verify artifact hashes when loading store

# SAT solver configuration
solver:
  binary: "infra/build/kissat"
  # Path to Kissat binary (relative to repo root)
  default_seed: 42
  # Default random seed for deterministic execution
  timeout_seconds: 300
  # Solver timeout (5 minutes default)
  enable_lrat: true
  # Generate LRAT proofs for UNSAT results
  cpu_only: true
  # Force CPU-only execution (no GPU)

# Circuit DSL configuration
circuits:
  max_gates: 1000
  # Maximum gates per circuit (safety limit)
  max_depth: 100
  # Maximum circuit depth (safety limit)
  max_inputs: 100
  # Maximum input variables
  validate_topology: true
  # Check for cycles and invalid references

# Agent configuration
agents:
  # Planner agent
  planner:
    enabled: true
    task_batch_size: 10
    # Number of tasks per plan
  
  # Conjecturer agent
  conjecturer:
    enabled: true
    mode: "template"
    # Options: "template", "llm" (llm requires local model)
    template_depth: 3
    # Maximum depth for template generation
    # Legacy mine pipeline LLM (disabled). Prefer saturday_loop for research.
    llm:
      enabled: false
      # Set to true to activate LLM conjecture path. Requires Ollama running.
      model: "qwen2.5-coder:14b"
      endpoint: "http://localhost:11434"
      num_predict: 8192
      temperature: 0.1
  
  # Miner agent
  miner:
    enabled: true
    small_n_only: true
    # Only mine small instances (n <= 20)
    max_variables: 20
    # Maximum variables for mining
    max_clauses: 1000
    # Maximum clauses for mining
  
  # Formalizer agent
  formalizer:
    enabled: true
    allow_sorry: true
    # Allow incomplete proofs with sorry placeholders
    tactic_timeout: 30
    # Timeout per tactic in seconds
    # V14: LLM-assisted sorry closing
    close_sorry_attempts: 3
    # Number of LLM attempts per sorry proof before giving up
    close_sorry_with_llm: true
    # Use LLM (V11 model) to close sorry stubs when LLM is enabled
  
  # Critic agent
  critic:
    enabled: true
    check_relativization: true
    # Check for relativization barrier
    check_natural_proofs: true
    # Check for natural proofs barrier
    check_algebraization: false
    # Algebraization check (experimental)

# Logging configuration
logging:
  level: "INFO"
  # Options: DEBUG, INFO, WARNING, ERROR
  format: "jsonl"
  # Options: jsonl, text
  log_dir: "search/logs"
  # Directory for log files
  console_output: true
  # Also log to console
  verbose: true
  # Include detailed messages

# Execution configuration
execution:
  parallel: false
  # Parallel execution (future feature)
  max_workers: 1
  # Number of worker processes (when parallel enabled)
  checkpoint_interval: 10
  # Save checkpoint every N tasks
  continue_on_error: false
  # Whether to continue if task fails

# Research bets configuration
bets:
  # Bet A: Restricted-Circuit Lower Bounds
  bet_a:
    enabled: true
    circuit_types:
      - "monotone"
      - "ac0"
      - "formula"
    size_range:
      min: 5
      max: 20
      step: 5
  
  # Bet B: Algorithm Synthesis (future)
  bet_b:
    enabled: false
  
  # Bet C: Hardness-vs-Randomness (future)
  bet_c:
    enabled: false
  
  # Bet D: Barrier-Aware Reductions (future)
  bet_d:
    enabled: false

# Verification configuration
verification:
  enable_lrat_check: true
  # Verify LRAT proofs with external checker
  lrat_checker: "lrat-check"
  # Path to LRAT checker binary
  enable_lean_build: true
  # Build Lean proofs as verification
  lean_timeout: 300
  # Lean build timeout in seconds

# Reproducibility configuration
reproducibility:
  pin_dependencies: true
  # Enforce pinned dependency versions
  check_determinism: true
  # Verify deterministic execution
  record_hashes: true
  # Record SHA256 of all artifacts
  fixed_seeds: true
  # Use fixed seeds from config

# Cost guard configuration
cost:
  enabled: true
  max_monthly_spend: 0
  # Hard limit: $0 (zero cost)
  block_api_calls: true
  # Block all API calls
  allowed_domains: []
  # No external domains allowed

# Local saturday research loop (CLI + localhost models; option A)
saturday_loop:
  enabled: true
  endpoint: "http://localhost:11434"
  api_style: "ollama"
  timeout_seconds: 600
  require_local: true
  # Empty: use Ollama default store. Override with OLLAMA_MODELS or
  # SATURDAY_MODELS_DIR (preferred) rather than hardcoding a volume path here.
  models_dir: ""
  prove:
    model: "qwen2.5:14b"
    num_predict: 8192
    temperature: 0.2
  formalize:
    # Prefer Goedel-Prover-V2-8B behind an OpenAI compatible local server when available
    model: "qwen2.5-coder:14b"
    num_predict: 8192
    temperature: 0.1
  audit:
    model: "qwen2.5:14b"
    num_predict: 4096
    temperature: 0.1
  # Optional OpenRouter escalation (off by default; enable with satday --remote)
  remote:
    enabled: false
    mode: "remote"
    endpoint: "https://openrouter.ai/api/v1"
    api_style: "openai_compatible"
    api_key_env: "OPENROUTER_API_KEY"
    timeout_seconds: 600
    use_for_formalize: true
    use_for_prove: true
    use_for_audit: false
    # Role-tuned OpenRouter models (override with OPENROUTER_FORMALIZE_MODEL / OPENROUTER_PROVE_MODEL)
    # deepseek/deepseek-prover-v2 has no live OpenRouter endpoints (404).
    formalize_model: "anthropic/claude-opus-4.5"
    formalize_fallback_model: "qwen/qwen3-coder-plus"
    prove_model: "anthropic/claude-opus-4.5"
    prove_fallback_model: "google/gemini-2.5-pro"
    audit_model: "anthropic/claude-sonnet-4.5"
    http_referer: "https://github.com/astrogirlnim/SATurday"
    app_title: "SATurday"
    min_request_interval_seconds: 2.0
    rate_limit_backoff_seconds: 30.0
    rate_limit_retries: 3
  reflect:
    enabled: true
    max_wakes_without_obligation_progress: 5
    max_consecutive_near_duplicates: 3
    max_consecutive_same_error: 3
    # Method audit / restatement after obligation plateau (not more formalize thrash)
    plateau_switch_action: "prove"
    auto_kill_on_plateau: true
    # Pause the stuck rung only; do not freeze R2 and R5 together
    auto_kill_scope: "rung"
    ambient_red_pause_after: 3
    reject_near_duplicate_drafts: true
  # Stuck formalize: accepted reuse check, then LLM micro split (plan JSON only)
  decompose:
    enabled: true
    trigger_after_wakes: 3
    max_micro_steps: 8
    min_accepted_reuse_score: 4.0
    plans_dir: "search/logs/decompose_plans"
    hold_kill_while_pending: true
  # Loop native proof import (docs/prd/proof-import.md). Auto only reads cache.
  proof_import:
    enabled: true
    cache_dir: "search/proof_sources"
    allow_network_fetch: false
    catalog:
      - id: "afp-expander-graphs-mgg"
        itps: ["isabelle"]
        title: "AFP Expander Graphs MGG"
        root: "afp-expander-graphs-mgg"
        license: "BSD"
        maps_to_rungs: ["r2-width-machinery"]
        maps_to_frontier: []
        lean_module: "theory/Theory/ProofComplexity/MGG/Factor2Inv4.lean"
        primary_theories:
          - "Expander_Graphs_MGG"
          - "Expander_Graphs_Cheeger_Inequality"
          - "Expander_Graphs_Definition"
          - "Expander_Graphs_Eigenvalues"
          - "Expander_Graphs_Strongly_Explicit"
        fetch_url: "https://www.isa-afp.org/release/afp-current.tar.gz"
        archive_member: "thys/Expander_Graphs"
        notes: "Hoory style Fourier proof; spectral bound 5/8 sqrt 2; vendor via satday proof-source; discrete ladder via satday proof-source ladder"
  # Rank a small subset of accepted_declarations.txt into formalize/prove prompts
  accepted_select:
    enabled: true
    decls_path: "scripts/accepted_declarations.txt"
    max_names: 60
    min_score: 1.0
    rung_token_hints:
      r0-resolution-foundations:
        - resolution
        - derivation
        - refutable
      r1-php-haken:
        - php
        - pigeon
        - critical
        - monotone
        - matching
        - complexity
      r2-width-machinery:
        - mgg
        - HasExpansion
        - ExpansionInv
        - Cheeger
        - Tseitin
        - CSExpansion
        - Width
        - Spreads
        - Petersen
        - Heawood
        - bsw
        - fat
        - clause
      r5-cook-reckhow-bridge:
        - Bridge
        - validates
        - decode
        - FinTM
        - truthTable
        - PropFormula
        - lengthGate
        - Cost
  falsify_family: "php"
  falsify_n_min: 4
  falsify_n_max: 10
  falsify_seed: 42
  draft_dir: "search/logs/saturday_drafts"
  sessions_path: "search/logs/saturday_sessions.jsonl"
  auto_apply: true
  formalize_repair_attempts: 2
  formalize_require_green_lake: true
  # 0: next wake starts as soon as the prior wave finishes
  loop_sleep_seconds: 0
  loop_max_cycles: 1
  loop_parallel_default: false

