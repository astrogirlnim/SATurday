# Bet A Stage 1: Known Territory (Baseline)
# Goal: Formalize existing monotone parity results to validate system
# Expected: n=2-10 should show clear lower bounds

# Offline policy enforcement
offline:
  enabled: true
  check_api_keys: true

# Artifact store configuration
artifacts:
  store_dir: "proofs"
  auto_register: true
  verify_on_load: false

# SAT solver configuration
solver:
  binary: "infra/build/kissat"
  default_seed: 42
  timeout_seconds: 60  # 1 minute per instance (generous for small n)
  enable_lrat: true    # Always generate proofs
  cpu_only: true

# Circuit DSL configuration
circuits:
  max_gates: 1000
  max_depth: 100
  max_inputs: 100
  validate_topology: true

# Override for Bet A exploration
bets:
  bet_a:
    enabled: true
    circuit_types:
      - "monotone"
    target_functions:
      - "parity"
    size_range:
      min: 2
      max: 20
      step: 1
    seed_range:
      start: 12000
      count: 100

# Agent overrides for systematic exploration
agents:
  planner:
    enabled: true
    task_batch_size: 100
  conjecturer:
    enabled: true
    mode: "template"
    template_depth: 3
  miner:
    enabled: true
    small_n_only: false
    max_variables: 100
    max_clauses: 10000
  formalizer:
    enabled: true
    allow_sorry: true
    tactic_timeout: 30
  critic:
    enabled: true
    check_relativization: true
    check_natural_proofs: true
    check_algebraization: false

# Logging for detailed analysis
logging:
  level: "DEBUG"
  format: "jsonl"
  log_dir: "search/logs"
  console_output: true
  verbose: true

# Execution settings
execution:
  parallel: false
  max_workers: 1
  checkpoint_interval: 10
  continue_on_error: true

# Reproducibility
reproducibility:
  pin_dependencies: true
  check_determinism: true
  record_hashes: true
  fixed_seeds: true

# Cost guard (enforce zero-cost)
cost:
  enabled: true
  max_monthly_spend: 0
  block_api_calls: true
  allowed_domains: []

# Verification configuration
verification:
  enable_lrat_check: true
  lrat_checker: "lrat-check"
  enable_lean_build: true
  lean_timeout: 300
